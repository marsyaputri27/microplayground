  <main class="container">
    <div class="page-title">
       <svg class="page-rails" viewBox="0 0 320 64" height="64" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <linearGradient id="pgNeon1" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#22d3ee"/>
            <stop offset="50%" stop-color="#7c3aed"/>
            <stop offset="100%" stop-color="#f59e0b"/>
          </linearGradient>
        </defs>
        <path class="rail-top" d="M8 22 Q 8 6 22 6 H 320" stroke="url(#pgNeon1)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path class="rail-bot" d="M16 56 H 300 l 22 -10" stroke="url(#pgNeon1)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <div class="title-text"><h1 class="title-chip">Chips</h1></div>
    </div>
    <p class="muted">Filter berdasarkan tipe, interface, atau tegangan. Klik “Detail” untuk modal lengkap.</p>

    <div class="filters">
      <span class="select-wrap">
        <select id="fType">
          <option value="">Semua tipe</option>
          <option value="board">Board</option>
          <option value="sensor">Sensor</option>
          <option value="actuator">Actuator</option>
          <option value="module">Module</option>
        </select>
        <span class="caret" aria-hidden="true">▾</span>
      </span>
      <span class="select-wrap">
        <select id="fIface">
          <option value="">Interface</option>
          <option>Digital</option>
          <option>Analog</option>
          <option>I2C</option>
          <option>SPI</option>
          <option>UART</option>
          <option>PWM</option>
        </select>
        <span class="caret" aria-hidden="true">▾</span>
      </span>
      <span class="select-wrap">
        <select id="fVolt">
          <option value="">Tegangan</option>
          <option value="5V">5V</option>
          <option value="3.3V">3.3V</option>
        </select>
        <span class="caret" aria-hidden="true">▾</span>
      </span>
    </div>

    <div id="comp-grid" class="cards"></div>
  </main>

      <circle cx="9" cy="10" r="1.2" fill="#5f78ff"/>
      <circle cx="12" cy="10" r="1.2" fill="#5f78ff"/>
      <circle cx="15" cy="10" r="1.2" fill="#5f78ff"/>
